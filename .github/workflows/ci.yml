name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and run C tests (no graphics layer)
        run: make test

      - name: Validate puzzle atoms
        run: python3 tools/validate_atoms.py

      - name: Export compact atom registry
        run: python3 tools/export_atoms.py --output build/atoms.spa

      - name: Check Python tool syntax
        run: python3 -m py_compile tools/*.py

      - name: Show atom registry
        run: |
          ls -lh build/atoms.spa
          head -5 build/atoms.spa
