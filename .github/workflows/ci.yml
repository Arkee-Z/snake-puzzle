name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: make

      - name: Run C tests
        run: make test

      - name: Smoke test
        run: |
          ./build/sp --version
          printf 'p\nq\n' | ./build/sp --no-color maps/tutorial.map > /dev/null

      - name: Check packaging tool syntax
        run: python3 -m py_compile tools/package_release.py
