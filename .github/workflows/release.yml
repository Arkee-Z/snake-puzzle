name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            platform: macos-arm64
            arch: arm64
          - name: macos-x86_64
            os: macos-14
            platform: macos-x86_64
            arch: x86_64
          - name: linux-x86_64
            os: ubuntu-22.04
            platform: linux-x86_64
          - name: windows-x86_64
            os: windows-2022
            platform: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION_NUM="dev"; fi
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_ENV"
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSP_BUILD_TESTS=OFF \
            -DSP_RELEASE_VERSION="${VERSION_NUM}" \
            ${EXTRA}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --parallel 2
          file build/snake_puzzle
          if [ "$(uname -m)" = "${{ matrix.arch }}" ]; then
            ./build/snake_puzzle --version
          else
            echo "Cross-compiled ${{ matrix.arch }} binary; runtime smoke test skipped."
          fi

      - name: Smoke test (Linux)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          ./build/snake_puzzle --batch 20 --seed 1000 > /tmp/batch.jsonl
          test "$(wc -l < /tmp/batch.jsonl)" -eq 20
          ! grep -q '"valid":false' /tmp/batch.jsonl

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 tools/package_release.py \
            --binary build/snake_puzzle \
            --platform "${{ matrix.platform }}" \
            --version "${VERSION_NUM}" \
            --output-dir release

      - name: Install MSYS2 toolchain
        if: matrix.name == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            ca-certificates

      - name: Configure and build (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION_NUM="dev"; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSP_BUILD_TESTS=OFF \
            -DSP_RELEASE_VERSION="${VERSION_NUM}"
          cmake --build build --parallel 2
          ./build/snake_puzzle.exe --version
          ./build/snake_puzzle.exe --batch 20 --seed 1000 > batch.jsonl
          test "$(wc -l < batch.jsonl)" -eq 20
          ! grep -q '"valid":false' batch.jsonl
          echo "--- executable dependencies ---"
          ldd build/snake_puzzle.exe || true

      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          python tools/package_release.py `
            --binary build/snake_puzzle.exe `
            --platform windows-x86_64 `
            --version $version `
            --output-dir release
          Get-ChildItem release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          echo "--- release payload ---"
          ls -lh
          cat SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Snake Puzzle ${{ github.ref_name }}
          body: |
            ## Downloads

            - macOS Apple Silicon: `snake-puzzle-<version>-macos-arm64.tar.gz`
            - macOS Intel: `snake-puzzle-<version>-macos-x86_64.tar.gz`
            - Linux x86_64: `snake-puzzle-<version>-linux-x86_64.tar.gz`
            - Windows x86_64: `snake-puzzle-<version>-windows-x86_64.zip`

            Extract the archive and run `snake_puzzle` (or `snake_puzzle.exe` on Windows).
            The atom registry is bundled in `assets/atoms`; no external runtime is required.
            Linux builds are validated on Ubuntu 22.04 and require common X11/OpenGL desktop libraries.
            macOS builds are unsigned, so Gatekeeper may require a right-click → Open on first launch.

            SHA-256 checksums are included in `SHA256SUMS`.
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
