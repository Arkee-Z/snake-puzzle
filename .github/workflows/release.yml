name: Release terminal binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            platform: macos-arm64
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos-x86_64
          - name: linux-x86_64
            os: ubuntu-22.04
            platform: linux-x86_64
          - name: windows-x86_64
            os: windows-2022
            platform: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION_NUM="dev"; fi
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_ENV"

      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make
          make test
          ./build/sp --version
          printf 'p\nq\n' | ./build/sp --no-color maps/tutorial.map > /dev/null

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 tools/package_release.py \
            --binary build/sp \
            --platform "${{ matrix.platform }}" \
            --version "${VERSION_NUM}" \
            --output-dir release

      - name: Install MSYS2 toolchain
        if: matrix.name == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            ca-certificates

      - name: Build and test (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          make
          make test
          ./build/sp.exe --version
          printf 'p\nq\n' | ./build/sp.exe --no-color maps/tutorial.map > /dev/null

      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          python tools/package_release.py `
            --binary build/sp.exe `
            --platform windows-x86_64 `
            --version $version `
            --output-dir release
          Get-ChildItem release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          echo "--- release payload ---"
          ls -lh
          cat SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Snake Puzzle ${{ github.ref_name }}
          body: |
            ## Terminal Snake Puzzle

            This is the rebuilt, dependency-free terminal version of Snake Puzzle:
            turn-based BFS-friendly puzzle mode, food-quota door, real-time chamber,
            clear-screen ANSI rendering and a writable `player_move` BFS strategy.

            Download the archive for your platform from Assets, extract it, and run
            `sp` (`sp.exe` on Windows). The `maps/tutorial.map` file is included.

            - macOS 11+, Intel or Apple Silicon; unsigned (right-click → Open).
            - Linux x86_64; built on Ubuntu 22.04 (glibc 2.35+).
            - Windows 10/11 x64; MinGW runtime is statically linked.

            `SHA256SUMS` is generated for every archive.
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
